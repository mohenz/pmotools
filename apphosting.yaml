env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  - variable: DATABASE_SSL
    value: require
    availability:
      - RUNTIME
  - variable: DATABASE_POOL_MAX
    value: "3"
    availability:
      - RUNTIME
  - variable: DATABASE_CONNECTION_TIMEOUT_MS
    value: "10000"
    availability:
      - RUNTIME
  - variable: LOCAL_USER_ID
    value: 10000000-0000-4000-8000-000000000001
    availability:
      - RUNTIME
  - variable: DEFAULT_PROJECT_ID
    value: 20000000-0000-4000-8000-000000000001
    availability:
      - RUNTIME
