name: Gemini CLI Git Agent

# Gemini CLI(https://github.com/google-gemini/gemini-cli)에게 git pull/commit/push를
# 위임하는 수동 트리거 워크플로우입니다.
# - 보호 브랜치(main 등)에는 절대 직접 push하지 않고, 항상 gemini/* 전용 브랜치에서
#   작업한 뒤 PR을 생성해 사람이 리뷰/머지하도록 강제합니다.
# - 실행 전 리포지토리 Secrets에 GEMINI_API_KEY를 등록해야 합니다.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gemini CLI에게 지시할 작업 내용"
        required: true
        type: string
      base_branch:
        description: "pull 대상 base 브랜치"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gemini-git-agent-${{ github.workflow }}-${{ inputs.base_branch }}
  cancel-in-progress: false

jobs:
  gemini-git-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}

      - name: Configure git identity
        run: |
          git config user.name "gemini-cli-agent[bot]"
          git config user.email "gemini-cli-agent[bot]@users.noreply.github.com"

      - name: Pull latest base branch
        run: git pull --ff-only origin "${{ inputs.base_branch }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Create working branch
        id: branch
        run: |
          BRANCH="gemini/agent-run-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gemini --yolo -p "다음 작업을 이 저장소에서 수행해줘. 코드/문서를 수정하는 것까지만 하고,
          git add/commit/push는 이후 단계에서 별도로 처리하니 직접 실행하지 마.

          작업 내용: ${{ inputs.task }}"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage changes and generate commit message
        if: steps.diff.outputs.changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git add -A
          git diff --cached > /tmp/staged.diff
          gemini --yolo -p "아래 git diff만 보고 Conventional Commits 형식의 커밋 메시지를
          한 줄로만 출력해. 다른 설명이나 코드블록 없이 메시지 텍스트만 출력해:

          $(cat /tmp/staged.diff)" > /tmp/commit_msg.txt
          # Gemini 출력에 잡음이 섞일 수 있으므로 마지막 비어있지 않은 줄만 사용
          COMMIT_MSG=$(grep -v '^\s*$' /tmp/commit_msg.txt | tail -n 1)
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="chore: gemini cli automated change (run ${{ github.run_id }})"
          fi
          git commit -m "$COMMIT_MSG"

      - name: Push working branch
        if: steps.diff.outputs.changed == 'true'
        run: git push -u origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request for human review
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Gemini CLI: ${{ inputs.task }}" \
            --body "이 PR은 Gemini CLI Git Agent 워크플로우(run #${{ github.run_id }})가 자동 생성했습니다. 병합 전 반드시 리뷰하세요."

      - name: No changes summary
        if: steps.diff.outputs.changed == 'false'
        run: echo "Gemini CLI가 변경 사항을 만들지 않아 커밋/푸시를 생략했습니다."
